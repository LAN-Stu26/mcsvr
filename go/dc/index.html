<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 0 秒後自動跳轉至 Discord 連結 -->
    <meta http-equiv="refresh" content="0; url=https://discord.gg/FTzReGYz">
    <link rel="canonical" href="https://discord.gg/FTzReGYz">
    <title>立即加入官方伺服器...</title>
    <style>
        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            background-color: #2f3136;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .redirect-card {
            background-color: #36393f;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #ffffff;
        }
        p {
            color: #dcddde;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #5865f2;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #4752c4;
        }
    </style>
    <script>
        // JavaScript 即時觸發轉址（備援機制）
        window.location.href = "https://discord.gg/FTzReGYz";
    </script>
</head>
<body>

    <div class="redirect-card">
        <h2>正在前往 Discord 伺服器...</h2>
        <p>若網頁未自動跳轉，請點擊下方按鈕前往：</p>
        <a href="https://discord.gg/FTzReGYz" class="btn">前往 Discord</a>
    </div>

</body>
</html>
