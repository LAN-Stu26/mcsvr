<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伺服器地圖 - Lazy Sheep Minecraft 伺服器</title>
    <link rel="icon" href="/icon.png" type="image/png">
    
    <!-- 引入 Google Fonts：中文採用 Noto Sans，標題採用復古像素風 Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- 引入 Leaflet.js 地圖庫 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 引入導覽列共用樣式與頁面樣式 -->
    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="/footer.css">
    <link rel="stylesheet" href="map.css">
    
    <!-- 引入 Leaflet.js 地圖庫 JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div class="container">

        <!-- 頁面頂部標題卡片 -->
        <header class="map-header-card">
            <h1 class="server-logo">Server Map</h1>
        </header>

        <!-- 主要地圖展示區域 -->
        <main class="main-content">
            <section class="card map-wrapper-card">
                <div class="card-title">
                    <i class="fa-solid fa-map-location-dot"></i> 世界地圖視窗
                </div>
                
                <!-- 地圖切換與控制提示條 -->
                <div class="map-toolbar">
                    <!-- 圖片切換列表按鈕（最多放 3 個，其餘收進更多選單） -->
                    <div class="map-selector">
                        <span style="color: #aaa; font-weight: bold; font-size: 0.9rem; align-self: center;">切換地圖：</span>
                        <a href="#814a" class="mc-btn mc-btn-sm map-tab-btn" data-map="814a">
                            <i class="fa-solid fa-map"></i> 8/14 主世界
                        </a>
                        <a href="#814b" class="mc-btn mc-btn-sm map-tab-btn" data-map="814b">
                            <i class="fa-solid fa-map"></i> 8/14 主世界(無位置標籤)
                        </a>

                        <!-- 超過 3 張圖時折疊收納 -->
                        <div class="map-dropdown" id="mapDropdown">
                            <button class="mc-btn mc-btn-sm dropdown-btn" onclick="toggleDropdown(event)">
                                <i class="fa-solid fa-layer-group"></i> 更多地圖 <i class="fa-solid fa-caret-down"></i>
                            </button>
                            <div class="dropdown-content">
                                <a href="#813a" class="dropdown-item map-tab-btn" data-map="813a">
                                    <i class="fa-solid fa-map"></i> 8/13 主世界(a)
                                </a>
                                <a href="#813b" class="dropdown-item map-tab-btn" data-map="813b">
                                    <i class="fa-solid fa-map"></i> 8/13 主世界(無位置標籤)(b)
                                </a>
                                <a href="#812b" class="dropdown-item map-tab-btn" data-map="812b">
                                    <i class="fa-solid fa-map"></i> 8/12 主世界(b)
                                </a>
                                <a href="#812c" class="dropdown-item map-tab-btn" data-map="812c">
                                    <i class="fa-solid fa-map"></i> 8/12 主世界(含標籤)(c)
                                </a>
                                <a href="#812d" class="dropdown-item map-tab-btn" data-map="812d">
                                    <i class="fa-solid fa-map"></i> 8/12 主世界(d)
                                </a>
                                <a href="#812e" class="dropdown-item map-tab-btn" data-map="812e">
                                    <i class="fa-solid fa-map"></i> 8/12 主世界(含標籤)(e)
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- 操作與下載區域 -->
                    <div class="toolbar-actions">
                        <span id="loadingNotice" class="loading-status" style="display: none;">
                            <i class="fa-solid fa-spinner fa-spin"></i> 載入中...
                        </span>
                        <a id="downloadMapBtn" class="mc-btn mc-btn-sm" download target="_blank">
                            <i class="fa-solid fa-download"></i> 下載圖片
                        </a>
                        <button class="mc-btn mc-btn-sm" onclick="resetMapCenter()">
                            <i class="fa-solid fa-crosshairs"></i> 回原點 (0, 0)
                        </button>
                    </div>
                </div>

                <!-- Leaflet 地圖容器 -->
                <div id="map"></div>
            </section>

            <!-- 地圖說明與座標指南 -->
            <section class="card">
                <h2 class="card-title">地圖使用說明</h2>
                <div class="features-grid">
                    <div class="feature-item">
                        <div class="feature-title"><span>✦</span> 平面座標系統</div>
                        <p style="color: #ccc; font-size: 0.95rem;">地圖採用平面座標渲染，座標點直接對應 Minecraft 遊戲內的世界座標。</p>
                    </div>
                    <div class="feature-item">
                        <div class="feature-title"><span>✦</span> 縮放瀏覽</div>
                        <p style="color: #ccc; font-size: 0.95rem;">支援自由平滑放大與縮小，可完整檢視已探索的伺服器地貌。</p>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- 頁尾載入點 -->
    <div id="footer-placeholder"></div>
    
    <script src="/nav.js"></script>
    <script src="/footer.js" defer></script>

    <!-- 地圖載入與 Hash 路由邏輯 Script -->
    <script>
        // 1. 地圖清單配置檔
        const mapsData = {
            '814a': { url: '20260814/a.png', name: '8/14 主世界' },
            '814b': { url: '20260814/b.png', name: '8/14 主世界(無位置標籤)' },
            '813a': { url: '20260813/a.png', name: '8/13 主世界' },
            '813b': { url: '20260813/b.png', name: '8/13 主世界(無位置標籤)' },
            '812a': { url: '20260812/a.png', name: '8/12 主世界(新)' },
            '812b': { url: '20260812/b.png', name: '8/12 主世界(含標籤)(新)' },
            '812c': { url: '20260812/c.png', name: '8/12 主世界' },
            '812d': { url: '20260812/d.png', name: '8/12 主世界(含標籤)' },
            '812e': { url: '20260812/d.png', name: '8/12 主世界(含標籤)' }
        };

        // 2. 初始化 Leaflet 地圖（採用平面座標系 L.CRS.Simple）
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 3,
            zoomSnap: 0.5,
            attributionControl: false
        });

        let currentOverlay = null;
        let mapBounds = null;
        let currentLoadToken = 0; // 防止快速連續點擊時的非同步競態問題

        // 3. 按需下載並平滑載入地圖圖片
        function loadMapByKey(key) {
            const targetKey = mapsData[key] ? key : '814a';
            const mapInfo = mapsData[targetKey];

            // 更新按鈕高亮狀態
            let isDropdownActive = false;
            document.querySelectorAll('.map-tab-btn').forEach(btn => {
                if (btn.getAttribute('data-map') === targetKey) {
                    btn.classList.add('active');
                    if (btn.classList.contains('dropdown-item')) {
                        isDropdownActive = true;
                    }
                } else {
                    btn.classList.remove('active');
                }
            });

            // 若選擇的是下拉選單裡的地圖，高亮下拉按鈕
            const dropdownBtn = document.querySelector('.dropdown-btn');
            if (dropdownBtn) {
                if (isDropdownActive) {
                    dropdownBtn.classList.add('active');
                } else {
                    dropdownBtn.classList.remove('active');
                }
            }

            // 更新下載按鈕網址
            const downloadBtn = document.getElementById('downloadMapBtn');
            if (downloadBtn) {
                downloadBtn.href = mapInfo.url;
                downloadBtn.download = mapInfo.url;
            }

            // 顯示載入中提示
            const loadingNotice = document.getElementById('loadingNotice');
            if (loadingNotice) loadingNotice.style.display = 'inline-flex';

            const thisToken = ++currentLoadToken;

            // 在背景下載圖片，下載期間保持當前地圖顯示不白屏
            const img = new Image();
            img.src = mapInfo.url;

            img.onload = function() {
                // 如果載入期間使用者又切換了別張圖，則捨棄舊請求
                if (thisToken !== currentLoadToken) return;

                const w = this.naturalWidth;
                const h = this.naturalHeight;
                
                // 設定圖片中心為 (0, 0)
                mapBounds = [[-h / 2, -w / 2], [h / 2, w / 2]];
                
                // 無縫替換：先加入新圖層，再移除舊圖層
                const newOverlay = L.imageOverlay(mapInfo.url, mapBounds).addTo(map);
                if (currentOverlay) {
                    map.removeLayer(currentOverlay);
                }
                currentOverlay = newOverlay;
                
                // 自動重置視野涵蓋新圖片
                map.fitBounds(mapBounds);

                if (loadingNotice) loadingNotice.style.display = 'none';
            };

            img.onerror = function() {
                if (thisToken !== currentLoadToken) return;
                if (loadingNotice) loadingNotice.style.display = 'none';
                alert('地圖圖片載入失敗，請檢查檔案是否存在：' + mapInfo.url);
            };
        }

        // 下開選單選單開關
        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('mapDropdown');
            dropdown.classList.toggle('open');
        }

        // 點擊頁面其它區域自動收合下拉選單
        window.addEventListener('click', function() {
            const dropdown = document.getElementById('mapDropdown');
            if (dropdown) dropdown.classList.remove('open');
        });

        // 4. 監聽網址 Hash 變更事件
        function handleHashChange() {
            const hashKey = window.location.hash.replace('#', '').toLowerCase();
            loadMapByKey(hashKey);
        }

        window.addEventListener('hashchange', handleHashChange);
        window.addEventListener('DOMContentLoaded', handleHashChange);

        // 重置地圖中心回原點 (0, 0)
        function resetMapCenter() {
            if (mapBounds) {
                map.fitBounds(mapBounds);
            } else {
                map.setView([0, 0], 0);
            }
        }
    </script>
</body>
</html>
