<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伺服器地圖 - Lazy Sheep Minecraft 伺服器</title>
    <link rel="icon" href="/icon.png" type="image/png">
    
    <!-- 引入 Google Fonts：中文採用 Noto Sans，標題採用復古像素風 Press Start 2P -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- 引入 Leaflet.js 地圖庫 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 引入導覽列共用樣式與頁面樣式 -->
    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="/footer.css">
    <link rel="stylesheet" href="map.css">
    
    <!-- 引入 Leaflet.js 地圖庫 JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <div class="container">

        <!-- 頁面頂部標題卡片 -->
        <header class="map-header-card">
            <h1 class="server-logo">Server Map</h1>
        </header>

        <!-- 主要地圖展示區域 -->
        <main class="main-content">
            <section class="card map-wrapper-card">
                <div class="card-title">
                    <i class="fa-solid fa-map-location-dot"></i> 世界地圖視窗
                </div>
                
                <!-- 地圖切換與控制提示條 -->
                <div class="map-toolbar">
                    <!-- 圖片切換列表按鈕 -->
                    <div class="map-selector">
                        <span style="color: #aaa; font-weight: bold; font-size: 0.9rem; align-self: center;">切換地圖：</span>
                        <a href="#20260812d" class="mc-btn mc-btn-sm map-tab-btn" data-map="d">
                            <i class="fa-solid fa-map"></i> <b>8/12 主世界(新)</b>
                        </a>
                        <a href="#20260812e" class="mc-btn mc-btn-sm map-tab-btn" data-map="e">
                            <i class="fa-solid fa-map"></i> <b>8/12 主世界(含標籤)(新)</b>
                        </a>
                        <a href="#20260812b" class="mc-btn mc-btn-sm map-tab-btn" data-map="b">
                            <i class="fa-solid fa-map"></i> 8/12 主世界
                        </a>
                        <a href="#20260812c" class="mc-btn mc-btn-sm map-tab-btn" data-map="c">
                            <i class="fa-solid fa-map"></i> 8/12 主世界(含標籤)
                        </a>
                    </div>

                    <button class="mc-btn mc-btn-sm" onclick="resetMapCenter()">
                        <i class="fa-solid fa-crosshairs"></i> 回原點 (0, 0)
                    </button>
                </div>

                <!-- Leaflet 地圖容器 -->
                <div id="map"></div>
            </section>

            <!-- 地圖說明與座標指南 -->
            <section class="card">
                <h2 class="card-title">地圖使用說明</h2>
                <div class="features-grid">
                    <div class="feature-item">
                        <div class="feature-title"><span>✦</span> 平面座標系統</div>
                        <p style="color: #ccc; font-size: 0.95rem;">地圖採用平面座標渲染，座標點直接對應 Minecraft 遊戲內的世界座標。</p>
                    </div>
                    <div class="feature-item">
                        <div class="feature-title"><span>✦</span> 縮放瀏覽</div>
                        <p style="color: #ccc; font-size: 0.95rem;">支援自由平滑放大與縮小，可完整檢視已探索的伺服器地貌。 </p>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- 頁尾載入點 -->
    <div id="footer-placeholder"></div>
    
    <script src="/nav.js"></script>
    <script src="/footer.js" defer></script>

    <!-- 地圖載入與 Hash 路由邏輯 Script -->
    <script>
        // 1. 地圖清單配置檔（可依需求擴充 #c, #d 等）
        const mapsData = {
            '20260812d': { url: '20260812d.png', name: '8/12 主世界(新)' },
            '20260812e': { url: '20260812e.png', name: '8/12 主世界(含標籤)(新)' },
            '20260812b': { url: '20260812b.png', name: '8/12 主世界' },
            '20260812c': { url: '20260812c.png', name: '8/12 主世界(含標籤)' }
        };

        // 2. 初始化 Leaflet 地圖（採用平面座標系 L.CRS.Simple）
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 3,
            zoomSnap: 0.5,
            attributionControl: false
        });

        let currentOverlay = null;
        let mapBounds = null;

        // 3. 載入指定 Hash Key 的地圖圖片
        function loadMapByKey(key) {
            // 若 Hash 不存在，預設載入 'e'
            const targetKey = mapsData[key] ? key : 'e';
            const mapInfo = mapsData[targetKey];

            // 更新按鈕高亮（Active Status）
            document.querySelectorAll('.map-tab-btn').forEach(btn => {
                if (btn.getAttribute('data-map') === targetKey) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // 移除舊的地圖覆蓋圖層
            if (currentOverlay) {
                map.removeLayer(currentOverlay);
            }

            // 載入新地圖圖片
            const img = new Image();
            img.src = mapInfo.url;

            img.onload = function() {
                const w = this.naturalWidth;
                const h = this.naturalHeight;
                
                // 設定圖片中心為 (0, 0)
                mapBounds = [[-h / 2, -w / 2], [h / 2, w / 2]];
                
                // 建立新的圖層並加入地圖
                currentOverlay = L.imageOverlay(mapInfo.url, mapBounds).addTo(map);
                
                // 自動重置視野涵蓋新圖片
                map.fitBounds(mapBounds);
            };
        }

        // 4. 監聽網址 Hash 變更事件 (#a, #b)
        function handleHashChange() {
            const hashKey = window.location.hash.replace('#', '').toLowerCase();
            loadMapByKey(hashKey);
        }

        window.addEventListener('hashchange', handleHashChange);
        window.addEventListener('DOMContentLoaded', handleHashChange);

        // 重置地圖中心回原點 (0, 0)
        function resetMapCenter() {
            if (mapBounds) {
                map.fitBounds(mapBounds);
            } else {
                map.setView([0, 0], 0);
            }
        }
    </script>
</body>
</html>
