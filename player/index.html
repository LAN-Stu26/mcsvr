<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家資料查詢 - Lazy Sheep Minecraft 伺服器</title>
    
    <link rel="icon" href="/icon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="/footer.css">
    <link rel="stylesheet" href="/player/player.css">
    
    <script src="/nav.js" defer></script>
    <script src="/footer.js" defer></script>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="player-container">
        <header class="player-header">
            <h1 class="player-title">PLAYER PROFILE</h1>
            <p class="player-subtitle">查詢您的點數餘額、繳費紀錄與遊玩時數統計</p>
        </header>

        <!-- 登入與註冊卡片區塊 -->
        <div class="search-card" id="auth-card">
            <!-- 狀態 1: 未登入 Google -->
            <div id="login-state-unauth" style="text-align: center; padding: 10px 0;">
                <p style="margin-bottom: 16px; color: #ddd;">請登入 Google 帳號以查看或綁定您的 Minecraft 玩家資料</p>
                <button type="button" class="btn-search" id="btn-google-login" onclick="loginWithGoogle()" style="width: auto; padding: 12px 28px; font-size: 1rem;">
                    <i class="fa-brands fa-google" style="margin-right: 8px;"></i> 使用 Google 帳號登入
                </button>
            </div>

            <!-- 狀態 2: 已登入 Google 但尚未綁定 Minecraft ID (首次註冊) -->
            <div id="login-state-register" style="display: none;">
                <h3 style="margin-top: 0; color: #ffaa00;"><i class="fa-solid fa-user-plus"></i> 首次登入：綁定 Minecraft 帳號</h3>
                <p style="color: #bbb; font-size: 0.9rem; margin-bottom: 15px;">
                    登入帳號：<strong id="reg-google-email" style="color: #fff;"></strong>（查無對應玩家資料，請建立新帳號）
                </p>
                <form class="search-form" id="register-form">
                    <input type="text" id="reg-mc-id" class="search-input" placeholder="輸入您的 Minecraft ID (例如: Steve)" required>
                    <button type="submit" class="btn-search" id="btn-register"><i class="fa-solid fa-check"></i> 完成註冊綁定</button>
                </form>
            </div>

            <!-- 狀態 3: 已登入且已載入資料 (顯示登出按鈕) -->
            <div id="login-state-authed" style="display: none; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <span style="color: #aaa; font-size: 0.9rem;">
                    <i class="fa-solid fa-circle-user" style="color: #55ff55;"></i> 當前登入：<strong id="logged-in-email" style="color: #fff;">--</strong>
                </span>
                <button type="button" class="btn-search" onclick="logoutGoogle()" style="background-color: #444; color: #fff; box-shadow: inset -2px -2px 0 #222, inset 2px 2px 0 #666; padding: 6px 16px; font-size: 0.85rem;">
                    <i class="fa-solid fa-right-from-bracket"></i> 登出帳號
                </button>
            </div>
        </div>

        <!-- 狀態訊息提示區塊 -->
        <div id="status-message" class="info-status-msg">
            <i class="fa-solid fa-user-gear fa-2x" style="margin-bottom: 12px; color: #ffaa00;"></i>
            <p>請點擊上方按鈕登入 Google 帳號以載入資料。</p>
        </div>

        <!-- 玩家 Profile 資料卡片 -->
        <div class="profile-card" id="profile-card">
            
            <div class="profile-header-info">
                <div class="avatar-box">
                    <img id="user-avatar" src="https://mc-heads.net/avatar/steve/80" alt="Minecraft Head">
                </div>
                <div class="user-main-details">
                    <h2 class="user-mc-id">
                        <span id="disp-mc-id">--</span>
                        <span id="disp-plan-badge" class="plan-badge-tag plan-free">FREE</span>
                    </h2>
                    <div class="user-email" id="disp-email"><i class="fa-regular fa-envelope"></i> --</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label"><i class="fa-solid fa-coins" style="color: #ffaa00;"></i> 剩餘 exaroton 點數</div>
                    <div class="stat-value" id="disp-points">0 <small>點</small></div>
                </div>

                <div class="stat-box">
                    <div class="stat-label"><i class="fa-solid fa-clock" style="color: #55ffff;"></i> 累積遊玩時數</div>
                    <div class="stat-value" style="color: #55ffff;" id="disp-playtime">0 <small>小時</small></div>
                </div>

                <div class="stat-box">
                    <div class="stat-label"><i class="fa-solid fa-calendar-check" style="color: #ff55ff;"></i> 最新贊助/繳費時間</div>
                    <div class="stat-value" style="font-size: 0.95rem; color: #ff55ff;" id="disp-last-payment">無紀錄</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label"><i class="fa-solid fa-shield-halved" style="color: #55ff55;"></i> 當前權限狀態</div>
                    <div class="stat-value" style="font-size: 0.95rem; color: #55ff55;" id="disp-status">正常</div>
                </div>
            </div>

            <div class="history-section-title">
                <i class="fa-solid fa-receipt"></i> 近期商城領取與兌換紀錄
            </div>
            <div class="history-table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>商品名稱</th>
                            <th>種類/金額</th>
                            <th>領取時間</th>
                            <th>發放狀態</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #888;">尚無任何領取紀錄</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="toast-msg" id="toast"></div>

    <div id="footer-placeholder"></div>
<script type="module">
    // ========================================================
    // Firebase SDK
    // ========================================================

    import { initializeApp } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getFirestore,
        collection,
        query,
        where,
        getDocs,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged,
        browserPopupRedirectResolver
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    // ========================================================
    // Firebase 專案設定
    // ========================================================

    const firebaseConfig = {
        apiKey: "AIzaSyDhQu5yJD1ojrWv9xZ6GTU2zhZwFH4e4KA",
        authDomain: "lazy-sheep-server.firebaseapp.com",
        projectId: "lazy-sheep-server",
        storageBucket: "lazy-sheep-server.firebasestorage.app",
        messagingSenderId: "665251951199",
        appId: "1:665251951199:web:45c36cc44badd65681a1ea",
        measurementId: "G-REH9JHGGJ8"
    };


    // ========================================================
    // 初始化 Firebase
    // ========================================================

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const auth = getAuth(app);

    const googleProvider = new GoogleAuthProvider();


    // ========================================================
    // 目前登入使用者
    // ========================================================

    let currentUser = null;


    // ========================================================
    // Google 登入
    // ========================================================

    async function loginWithGoogle() {

        const loginButton = document.getElementById("btn-google-login");

        try {

            // 防止使用者連續點擊
            if (loginButton) {
                loginButton.disabled = true;
                loginButton.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;"></i> 正在登入...';
            }


            console.log("開始 Google 登入...");
            console.log("Auth Domain:", firebaseConfig.authDomain);


            /*
             * 重要：
             *
             * 第三個參數明確指定
             * browserPopupRedirectResolver
             *
             * 用於 Firebase Web Auth 的 Popup / Redirect
             * 處理流程。
             */

            const result = await signInWithPopup(
                auth,
                googleProvider,
                browserPopupRedirectResolver
            );


            // 登入成功
            const user = result.user;

            console.log("Google 登入成功！");
            console.log("UID:", user.uid);
            console.log("Email:", user.email);

            showToast("✔ Google 登入成功");


        } catch (error) {

            console.error("================================");
            console.error("Google 登入失敗");
            console.error("錯誤代碼:", error.code);
            console.error("錯誤訊息:", error.message);
            console.error("完整錯誤:", error);
            console.error("================================");


            // 將比較容易理解的錯誤顯示給使用者
            let message = "登入失敗";

            switch (error.code) {

                case "auth/popup-blocked":
                    message =
                        "瀏覽器封鎖了登入視窗，請允許此網站開啟彈出視窗。";
                    break;

                case "auth/popup-closed-by-user":
                    message =
                        "Google 登入視窗被關閉。";
                    break;

                case "auth/cancelled-popup-request":
                    message =
                        "登入請求被取消，請重新嘗試。";
                    break;

                case "auth/unauthorized-domain":
                    message =
                        "目前網站網域尚未加入 Firebase Authentication 的授權網域。";
                    break;

                case "auth/operation-not-allowed":
                    message =
                        "Firebase Authentication 尚未啟用 Google 登入。";
                    break;

                case "auth/invalid-api-key":
                    message =
                        "Firebase API Key 無效。";
                    break;

                case "auth/internal-error":
                    message =
                        "Firebase Authentication 發生內部錯誤，請查看瀏覽器 Console。";
                    break;

                default:
                    message =
                        `${error.message || "未知錯誤"} (${error.code || "unknown"})`;
                    break;
            }

            showToast("❌ " + message);


        } finally {

            // 恢復登入按鈕
            if (loginButton) {
                loginButton.disabled = false;
                loginButton.innerHTML =
                    '<i class="fa-brands fa-google" style="margin-right:8px;"></i> 使用 Google 帳號登入';
            }

        }
    }


    // ========================================================
    // Google 登出
    // ========================================================

    async function logoutGoogle() {

        try {

            await signOut(auth);

            console.log("Google 登出成功");

            showToast("✔ 已成功登出帳號");

        } catch (error) {

            console.error("登出失敗:", error);

            showToast(
                "❌ 登出失敗：" +
                (error.message || "未知錯誤")
            );

        }
    }


    // ========================================================
    // 暴露給 HTML onclick
    // ========================================================

    window.loginWithGoogle = loginWithGoogle;
    window.logoutGoogle = logoutGoogle;


    // ========================================================
    // Firebase Auth 登入狀態監聽
    // ========================================================

    onAuthStateChanged(auth, async (user) => {

        const statusMsg =
            document.getElementById("status-message");

        const profileCard =
            document.getElementById("profile-card");

        const stateUnauth =
            document.getElementById("login-state-unauth");

        const stateRegister =
            document.getElementById("login-state-register");

        const stateAuthed =
            document.getElementById("login-state-authed");


        // ----------------------------------------------------
        // 使用者已登入
        // ----------------------------------------------------

        if (user) {

            currentUser = user;

            console.log("目前登入使用者:", user);


            document.getElementById("logged-in-email").innerText =
                user.email || "未提供 Email";

            document.getElementById("reg-google-email").innerText =
                user.email || "未提供 Email";


            statusMsg.style.display = "block";

            statusMsg.innerHTML = `
                <p>
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    正在驗證登入並讀取 Firestore 玩家資料...
                </p>
            `;


            await checkUserAndLoadData(user.email);

        }


        // ----------------------------------------------------
        // 使用者未登入
        // ----------------------------------------------------

        else {

            currentUser = null;

            stateUnauth.style.display = "block";

            stateRegister.style.display = "none";

            stateAuthed.style.display = "none";

            profileCard.classList.remove("active");


            statusMsg.style.display = "block";

            statusMsg.innerHTML = `
                <i
                    class="fa-solid fa-user-gear fa-2x"
                    style="margin-bottom: 12px; color: #ffaa00;"
                ></i>

                <p>
                    請於上方點擊按鈕登入 Google 帳號以載入資料。
                </p>
            `;

        }

    });


    // ========================================================
    // 檢查使用者是否存在並載入資料
    // ========================================================

    async function checkUserAndLoadData(email) {

        const statusMsg =
            document.getElementById("status-message");

        const profileCard =
            document.getElementById("profile-card");

        const stateUnauth =
            document.getElementById("login-state-unauth");

        const stateRegister =
            document.getElementById("login-state-register");

        const stateAuthed =
            document.getElementById("login-state-authed");


        try {

            // 查詢 users
            const q = query(
                collection(db, "users"),
                where("email", "==", email)
            );


            const userSnapshot = await getDocs(q);


            // ------------------------------------------------
            // 沒有玩家資料
            // ------------------------------------------------

            if (userSnapshot.empty) {

                stateUnauth.style.display = "none";

                stateRegister.style.display = "block";

                stateAuthed.style.display = "none";

                profileCard.classList.remove("active");


                statusMsg.style.display = "block";

                statusMsg.innerHTML = `
                    <i
                        class="fa-solid fa-user-plus fa-2x"
                        style="margin-bottom: 12px; color: #ffaa00;"
                    ></i>

                    <p style="color: #ffaa00;">
                        尚未綁定 Minecraft 帳號，
                        請於上方輸入 ID 以完成首次註冊。
                    </p>
                `;

            }


            // ------------------------------------------------
            // 已經有玩家資料
            // ------------------------------------------------

            else {

                stateUnauth.style.display = "none";

                stateRegister.style.display = "none";

                stateAuthed.style.display = "flex";


                const userData =
                    userSnapshot.docs[0].data();


                const mcIdLower =
                    userData.minecraftIdLower ||
                    (
                        userData.minecraftId
                            ? userData.minecraftId.toLowerCase()
                            : ""
                    );


                // 查詢商城領取紀錄
                let claimsDocs = [];


                if (mcIdLower) {

                    const claimsQ = query(
                        collection(db, "market_claims"),
                        where(
                            "minecraftIdLower",
                            "==",
                            mcIdLower
                        )
                    );


                    const claimsSnapshot =
                        await getDocs(claimsQ);


                    claimsDocs =
                        claimsSnapshot.docs.map(
                            doc => doc.data()
                        );

                }


                renderUserProfile(
                    userData,
                    claimsDocs
                );


                statusMsg.style.display = "none";

                profileCard.classList.add("active");

            }


        } catch (error) {

            console.error(
                "讀取玩家資料失敗:",
                error
            );


            statusMsg.style.display = "block";

            statusMsg.innerHTML = `
                <i
                    class="fa-solid fa-triangle-exclamation fa-2x"
                    style="margin-bottom: 12px; color: #ffaa00;"
                ></i>

                <p style="color: #ffaa00;">
                    讀取資料失敗，
                    請稍後再試或確認網路連線。
                </p>
            `;

        }

    }


    // ========================================================
    // 首次綁定 Minecraft 帳號
    // ========================================================

    document
        .getElementById("register-form")
        .addEventListener("submit", async function(e) {

            e.preventDefault();


            if (!currentUser) {

                showToast(
                    "⚠️ 請先登入 Google 帳號！"
                );

                return;
            }


            const mcId =
                document
                    .getElementById("reg-mc-id")
                    .value
                    .trim();


            if (!mcId) {

                showToast(
                    "⚠️ 請填寫 Minecraft ID！"
                );

                return;
            }


            const btnRegister =
                document.getElementById("btn-register");


            btnRegister.disabled = true;

            btnRegister.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> 建立帳號中...';


            try {

                const newUserObj = {

                    email: currentUser.email,

                    googleUid: currentUser.uid,

                    minecraftId: mcId,

                    minecraftIdLower:
                        mcId.toLowerCase(),

                    plan: "FREE",

                    points: 0,

                    playtimeHours: 0,

                    status: "正常運作中",

                    createdAt: serverTimestamp()

                };


                await setDoc(
                    doc(db, "users", currentUser.uid),
                    newUserObj,
                    {
                        merge: true
                    }
                );


                showToast(
                    "🎉 帳號綁定成功！"
                );


                await checkUserAndLoadData(
                    currentUser.email
                );


            } catch (error) {

                console.error(
                    "註冊寫入失敗:",
                    error
                );


                showToast(
                    "❌ 註冊失敗：" +
                    error.message
                );


            } finally {

                btnRegister.disabled = false;

                btnRegister.innerHTML =
                    '<i class="fa-solid fa-check"></i> 完成註冊綁定';

            }

        });


    // ========================================================
    // 渲染玩家 Profile
    // ========================================================

    function renderUserProfile(user, claims) {

        const mcId =
            user.minecraftId || "未知玩家";


        document.getElementById("user-avatar").src =
            `https://mc-heads.net/avatar/${mcId}/80`;


        document.getElementById("disp-mc-id").innerText =
            mcId;


        document.getElementById("disp-email").innerHTML =
            `<i class="fa-regular fa-envelope"></i> ${
                user.email || "未設定 Email"
            }`;


        // Plan
        const planBadge =
            document.getElementById("disp-plan-badge");


        const plan =
            (user.plan || "FREE").toUpperCase();


        planBadge.innerText = plan;

        planBadge.className =
            `plan-badge-tag plan-${plan.toLowerCase()}`;


        // 點數
        document.getElementById("disp-points").innerHTML =
            `${user.points ?? 0} <small>點</small>`;


        // 遊玩時數
        document.getElementById("disp-playtime").innerHTML =
            `${user.playtimeHours ?? 0} <small>小時</small>`;


        // 最後付款
        if (user.lastPaymentAt) {

            const payDate =
                user.lastPaymentAt.toDate
                    ? user.lastPaymentAt.toDate()
                    : new Date(user.lastPaymentAt);


            document.getElementById(
                "disp-last-payment"
            ).innerText =
                payDate.toLocaleDateString("zh-TW");

        } else {

            document.getElementById(
                "disp-last-payment"
            ).innerText =
                "無繳費紀錄";

        }


        // 帳號狀態
        document.getElementById("disp-status").innerText =
            user.status || "正常運作中";


        // 商城紀錄
        const tbody =
            document.getElementById(
                "history-table-body"
            );


        tbody.innerHTML = "";


        if (!claims || claims.length === 0) {

            tbody.innerHTML =
                '<tr><td colspan="4" style="text-align:center;color:#888;">尚無任何領取紀錄</td></tr>';

            return;
        }


        // 依日期排序
        claims.sort((a, b) => {

            const dateA =
                a.claimedAt
                    ? (
                        a.claimedAt.toDate
                            ? a.claimedAt.toDate()
                            : new Date(a.claimedAt)
                    )
                    : new Date(0);


            const dateB =
                b.claimedAt
                    ? (
                        b.claimedAt.toDate
                            ? b.claimedAt.toDate()
                            : new Date(b.claimedAt)
                    )
                    : new Date(0);


            return dateB - dateA;

        });


        // 建立紀錄
        claims.forEach(item => {

            const tr =
                document.createElement("tr");


            let claimTime =
                "未知時間";


            if (item.claimedAt) {

                const d =
                    item.claimedAt.toDate
                        ? item.claimedAt.toDate()
                        : new Date(item.claimedAt);


                claimTime =
                    d.toLocaleString(
                        "zh-TW",
                        {
                            hour12: false
                        }
                    );

            }


            const priceStr =
                (
                    !item.price ||
                    item.price === "0" ||
                    item.price === 0
                )
                    ? "免費領取"
                    : `$${item.price}`;


            const statusHtml =
                item.status === "completed"

                    ? '<span class="status-badge status-completed">✔ 已發放</span>'

                    : '<span class="status-badge status-pending">⏳ 處理中</span>';


            tr.innerHTML = `
                <td>
                    <strong>
                        ${item.itemName || "未命名商品"}
                    </strong>
                </td>

                <td style="color:#ffaa00;">
                    ${priceStr}
                </td>

                <td style="color:#aaa;font-size:0.85rem;">
                    ${claimTime}
                </td>

                <td>
                    ${statusHtml}
                </td>
            `;


            tbody.appendChild(tr);

        });

    }


    // ========================================================
    // Toast
    // ========================================================

    function showToast(message) {

        const toast =
            document.getElementById("toast");


        toast.innerText =
            message;


        toast.style.display =
            "block";


        setTimeout(() => {

            toast.style.display =
                "none";

        }, 3000);

    }

</script>
</body>
</html>
