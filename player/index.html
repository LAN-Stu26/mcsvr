<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家資料查詢 - Lazy Sheep Minecraft 伺服器</title>
    
    <link rel="icon" href="/icon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="/footer.css">
    <link rel="stylesheet" href="/player/player.css">
    
    <script src="/nav.js" defer></script>
    <script src="/footer.js" defer></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="player-container">
        <header class="player-header">
            <h1 class="player-title">PLAYER PROFILE</h1>
            <p class="player-subtitle">查詢您的點數餘額、繳費紀錄與遊玩時數統計</p>
        </header>

        <div class="search-card">
            <form class="search-form" id="search-form">
                <input type="text" id="search-mc-id" class="search-input" placeholder="輸入 Minecraft ID (例如: steve)" required>
                <input type="password" id="search-verify-code" class="search-input" placeholder="驗證碼，不知道請在 DC 私訊伺服主" required>
                <button type="submit" class="btn-search" id="btn-search"><i class="fa-solid fa-magnifying-glass"></i> 查詢帳號</button>
            </form>
        </div>

        <div id="status-message" class="info-status-msg">
            <i class="fa-solid fa-user-gear fa-2x" style="margin-bottom: 12px; color: #ffaa00;"></i>
            <p>請於上方輸入您的 Minecraft ID 與個人驗證碼以載入資料。</p>
        </div>

        <div class="profile-card" id="profile-card">
            
            <div class="profile-header-info">
                <div class="avatar-box">
                    <img id="user-avatar" src="https://mc-heads.net/avatar/steve/80" alt="Minecraft Head">
                </div>
                <div class="user-main-details">
                    <h2 class="user-mc-id">
                        <span id="disp-mc-id">--</span>
                        <span id="disp-plan-badge" class="plan-badge-tag plan-free">FREE</span>
                    </h2>
                    <div class="user-email" id="disp-email"><i class="fa-regular fa-envelope"></i> --</div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label"><i class="fa-solid fa-coins" style="color: #ffaa00;"></i> 剩餘 exaroton 點數</div>
                    <div class="stat-value" id="disp-points">0 <small>點</small></div>
                </div>

                <div class="stat-box">
                    <div class="stat-label"><i class="fa-solid fa-clock" style="color: #55ffff;"></i> 累積遊玩時數</div>
                    <div class="stat-value" style="color: #55ffff;" id="disp-playtime">0 <small>小時</small></div>
                </div>

                <div class="stat-box">
                    <div class="stat-label"><i class="fa-solid fa-calendar-check" style="color: #ff55ff;"></i> 最新贊助/繳費時間</div>
                    <div class="stat-value" style="font-size: 0.95rem; color: #ff55ff;" id="disp-last-payment">無紀錄</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label"><i class="fa-solid fa-shield-halved" style="color: #55ff55;"></i> 當前權限狀態</div>
                    <div class="stat-value" style="font-size: 0.95rem; color: #55ff55;" id="disp-status">正常</div>
                </div>
            </div>

            <div class="history-section-title">
                <i class="fa-solid fa-receipt"></i> 近期商城領取與兌換紀錄
            </div>
            <div class="history-table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>商品名稱</th>
                            <th>種類/金額</th>
                            <th>領取時間</th>
                            <th>發放狀態</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #888;">尚無任何領取紀錄</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="toast-msg" id="toast"></div>

    <div id="footer-placeholder"></div>

    <script>
        // ========================================================
        // Firebase 專案設定
        // ========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDhQu5yJD1ojrWv9xZ6GTU2zhZwFH4e4KA",
            authDomain: "lazy-sheep-server.firebaseapp.com",
            projectId: "lazy-sheep-server",
            storageBucket: "lazy-sheep-server.firebasestorage.app",
            messagingSenderId: "665251951199",
            appId: "1:665251951199:web:45c36cc44badd65681a1ea",
            measurementId: "G-REH9JHGGJ8"
        };

        // 初始化 Firebase Firestore
        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch (e) {
            console.warn("Firebase 初始化失敗，請檢查網路:", e);
        }

        // 頁面初次載入：自動檢查是否有登入 Session
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = sessionStorage.getItem('mcsvr_user');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    if (user && user.mcId) {
                        document.getElementById('search-mc-id').value = user.mcId;
                        fetchUserData(user.mcIdLower || user.mcId.toLowerCase());
                    }
                } catch (e) {
                    sessionStorage.removeItem('mcsvr_user');
                }
            }
        });

        // 監聽查詢表單提交
        document.getElementById('search-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const mcId = document.getElementById('search-mc-id').value.trim();
            const verifyCode = document.getElementById('search-verify-code').value.trim();

            if (!mcId || !verifyCode) {
                showToast("⚠️ 請填寫 Minecraft ID 與個人驗證碼！");
                return;
            }

            await fetchUserData(mcId.toLowerCase(), verifyCode);
        });

        // 讀取 Firebase `users` 與 `market_claims` 集合資料
        async function fetchUserData(mcIdLower, verifyCode = null) {
            const btnSearch = document.getElementById('btn-search');
            const statusMsg = document.getElementById('status-message');
            const profileCard = document.getElementById('profile-card');

            btnSearch.disabled = true;
            btnSearch.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 讀取中...';
            statusMsg.style.display = 'block';
            statusMsg.innerHTML = '<p>🔍 正在查詢 Firestore 玩家資料...</p>';
            profileCard.classList.remove('active');

            if (!db) {
                showToast("❌ 資料庫未連接");
                btnSearch.disabled = false;
                btnSearch.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> 查詢帳號';
                return;
            }

            try {
                // 1. 查詢 users 集合
                let userQueryRef = db.collection('users').where('minecraftIdLower', '==', mcIdLower);
                if (verifyCode) {
                    userQueryRef = userQueryRef.where('verificationCode', '==', verifyCode);
                }

                const userSnapshot = await userQueryRef.get();

                if (userSnapshot.empty) {
                    statusMsg.innerHTML = `
                        <i class="fa-solid fa-circle-xmark fa-2x" style="margin-bottom: 12px; color: #ff5555;"></i>
                        <p style="color: #ff5555;">查無此玩家資料或驗證碼不正確！</p>
                    `;
                    btnSearch.disabled = false;
                    btnSearch.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> 查詢帳號';
                    return;
                }

                const userData = userSnapshot.docs[0].data();
                
                // 2. 查詢該玩家的商城領取與兌換歷史
                const claimsSnapshot = await db.collection('market_claims')
                    .where('minecraftIdLower', '==', mcIdLower)
                    .get();

                // 3. 渲染至 UI 面板
                renderUserProfile(userData, claimsSnapshot.docs.map(doc => doc.data()));

                statusMsg.style.display = 'none';
                profileCard.classList.add('active');
                showToast(`✔ 成功載入 ${userData.minecraftId || mcIdLower} 的帳號資料`);

            } catch (error) {
                console.error("讀取玩家資料失敗:", error);
                statusMsg.innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation fa-2x" style="margin-bottom: 12px; color: #ffaa00;"></i>
                    <p style="color: #ffaa00;">讀取資料失敗，請稍後再試或確認網路連線。</p>
                `;
            } finally {
                btnSearch.disabled = false;
                btnSearch.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> 查詢帳號';
            }
        }

        // 將抓取到的資料填入畫面
        function renderUserProfile(user, claims) {
            const mcId = user.minecraftId || '未知玩家';
            
            // 替換頭像與基本資訊
            document.getElementById('user-avatar').src = `https://mc-heads.net/avatar/${mcId}/80`;
            document.getElementById('disp-mc-id').innerText = mcId;
            document.getElementById('disp-email').innerHTML = `<i class="fa-regular fa-envelope"></i> ${user.email || '未設定 Email'}`;

            // 贊助方案標籤
            const planBadge = document.getElementById('disp-plan-badge');
            const plan = (user.plan || 'FREE').toUpperCase();
            planBadge.innerText = plan;
            planBadge.className = `plan-badge-tag plan-${plan.toLowerCase()}`;

            // 四大核心統計
            document.getElementById('disp-points').innerHTML = `${user.points ?? 0} <small>點</small>`;
            document.getElementById('disp-playtime').innerHTML = `${user.playtimeHours ?? 0} <small>小時</small>`;

            // 最新繳費時間處理
            if (user.lastPaymentAt) {
                const payDate = user.lastPaymentAt.toDate ? user.lastPaymentAt.toDate() : new Date(user.lastPaymentAt);
                document.getElementById('disp-last-payment').innerText = payDate.toLocaleDateString('zh-TW');
            } else {
                document.getElementById('disp-last-payment').innerText = '無繳費紀錄';
            }

            // 權限狀態
            document.getElementById('disp-status').innerText = user.status || '正常運作中';

            // 渲染兌換/領取紀錄表格
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '';

            if (!claims || claims.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888;">尚無任何領取紀錄</td></tr>';
                return;
            }

            claims.sort((a, b) => {
                const dateA = a.claimedAt ? (a.claimedAt.toDate ? a.claimedAt.toDate() : new Date(a.claimedAt)) : new Date(0);
                const dateB = b.claimedAt ? (b.claimedAt.toDate ? b.claimedAt.toDate() : new Date(b.claimedAt)) : new Date(0);
                return dateB - dateA;
            });

            claims.forEach(item => {
                const tr = document.createElement('tr');
                
                let claimTime = '未知時間';
                if (item.claimedAt) {
                    const d = item.claimedAt.toDate ? item.claimedAt.toDate() : new Date(item.claimedAt);
                    claimTime = d.toLocaleString('zh-TW', { hour12: false });
                }

                const priceStr = (!item.price || item.price === '0' || item.price === 0) ? '免費領取' : `$${item.price}`;
                const statusHtml = item.status === 'completed' 
                    ? '<span class="status-badge status-completed">✔ 已發放</span>' 
                    : '<span class="status-badge status-pending">⏳ 處理中</span>';

                tr.innerHTML = `
                    <td><strong>${item.itemName || '未命名商品'}</strong></td>
                    <td style="color: #ffaa00;">${priceStr}</td>
                    <td style="color: #aaa; font-size: 0.85rem;">${claimTime}</td>
                    <td>${statusHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 顯示浮動 Toast 提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
