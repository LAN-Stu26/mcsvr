<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面維護中 - Lazy Sheep Server</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* 背景微弱網格裝飾 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        .maintenance-card {
            background: #18181c;
            border: 2px solid #2a2a30;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            font-size: 3.5rem;
            color: #ffaa00;
            margin-bottom: 20px;
            animation: wrenchBounce 2s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes wrenchBounce {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        .maintenance-title {
            font-family: 'Press Start 2P', 'Noto Sans TC', cursive;
            font-size: 1.2rem;
            color: #55ffff;
            margin-bottom: 15px;
            line-height: 1.5;
            text-shadow: 0 0 10px rgba(85, 255, 255, 0.3);
        }

        .maintenance-subtitle {
            font-size: 1.1rem;
            color: #e0e0e0;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .maintenance-desc {
            font-size: 0.95rem;
            color: #888888;
            margin-bottom: 30px;
            background: #101013;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #333339;
        }

        /* Minecraft 風格按鈕 */
        .mc-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background: #3c3c3c;
            color: #ffffff;
            border: 2px solid #5c5c5c;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), inset -2px -2px 0px rgba(0,0,0,0.4);
        }

        .mc-btn:hover {
            background: #4a4a4a;
            border-color: #ffff55;
            color: #ffff55;
            transform: translateY(-2deg);
        }

        .mc-btn:active {
            transform: translateY(1deg);
            box-shadow: inset -2px -2px 0px rgba(255,255,255,0.2), inset 2px 2px 0px rgba(0,0,0,0.4);
        }

        .countdown-text {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #666666;
        }

        .countdown-text span {
            color: #ffaa00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="icon-box">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        
        <h1 class="maintenance-title">SYSTEM MAINTENANCE</h1>
        
        <p class="maintenance-subtitle">
            此頁面正在維護當中！<br>請改天再來！
        </p>

        <div class="maintenance-desc">
            <i class="fa-solid fa-circle-info" style="color: #55ffff;"></i>
            工程師正努力更新與優化此功能，造成不便敬請見諒。
        </div>

        <a href="/" class="mc-btn">
            <i class="fa-solid fa-house"></i> 返回伺服器首頁
        </a>

        <div class="countdown-text">
            將於 <span id="timer">10</span> 秒後自動返回首頁
        </div>
    </div>

    <script>
        // 倒數計時自動回首頁邏輯
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timerElement) {
                timerElement.innerText = timeLeft;
            }
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = '/';
            }
        }, 1000);
    </script>
</body>
</html>
