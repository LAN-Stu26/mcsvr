<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伺服器精選 - Lazy Sheep</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <!-- 引入導覽列與頁尾依賴之字體與圖示庫，確保 nav.css / footer.css 正確渲染 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- 共用樣式與精選頁面專用樣式 -->
    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="/footer.css">
    <link rel="stylesheet" href="/featured/featured.css">
</head>
<body>
    <!-- 導覽列自動插入區 -->
    <div id="nav-placeholder"></div>

    <main class="featured-container">
        <!-- 頁面標題區 -->
        <header class="featured-hero">
            <h1 class="featured-title">✨ 伺服器精選</h1>
            <p class="featured-subtitle">探索 Lazy Sheep 伺服器玩家們的傑出建築、紅石巨作與景觀地標！</p>
        </header>

        <!-- 分類篩選按鈕 -->
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">全部展示</button>
            <button class="filter-btn" data-filter="build">建築巨作</button>
            <button class="filter-btn" data-filter="redstone">紅石科技</button>
            <button class="filter-btn" data-filter="landmark">景觀地標</button>
            <button class="filter-btn" data-filter="noun">無分類</button>
        </div>

        <!-- 精選展示卡片列表 -->
        <div class="featured-grid">
            <!-- 卡片 1 -->
            <article class="featured-card" data-category="noun">
                <div class="card-content">
                    <h2 class="card-title">伺服器icon</h2>
                    <div class="card-meta">
                        <span class="meta-item">👤 創作者：LazySheep & ChatGPT</span>
                        <span class="meta-item">🌍 世界：未知</span>
                    </div>
                    <p class="card-desc">理念: 舒服、友善、可以長期發展的 Minecraft 生存世界</p>
                    <!-- div class="card-footer">
                        <div class="coords-box">
                            <span class="coords-text">X: 0, Y: 0, Z: 0</span>
                        </div>
                        <button class="copy-btn" onclick="copyCoordinates('X: 0, Y: 64, Z: 0', this)">
                            📋 複製座標
                        </button>
                    </div -->
                </div>
                <div class="card-image-wrapper">
                    <img src="/featured/image/icon.png" alt="伺服器icon" class="card-image" loading="lazy">
                    <span class="card-badge">官網</span>
                </div>
            </article>
        </div>
    </main>

    <!-- Lightbox 圖片大圖檢視彈窗 -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <div class="lightbox-modal">
            <button class="lightbox-close" id="lightboxClose" aria-label="關閉">✕</button>
            <img src="" alt="圖片大圖" id="lightboxImg">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- 腳本 -->
    <script src="/nav.js"></script>
    <script src="/footer.js" defer></script>

    <script>
        // 一鍵複製座標
        function copyCoordinates(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = '✅ 已複製！';
                btnElement.classList.add('copied');
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('複製失敗:', err);
            });
        }

        // 頁面初始化邏輯
        document.addEventListener('DOMContentLoaded', function() {
            // 分類篩選邏輯
            const filterBtns = document.querySelectorAll('.filter-btn');
            const cards = document.querySelectorAll('.featured-card');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const filter = this.getAttribute('data-filter');
                    cards.forEach(card => {
                        if (filter === 'all' || card.getAttribute('data-category') === filter) {
                            card.style.display = 'flex';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            });

            // 大圖檢視 (Lightbox) 邏輯
            const lightboxOverlay = document.getElementById('lightboxOverlay');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxCaption = document.getElementById('lightboxCaption');
            const lightboxClose = document.getElementById('lightboxClose');

            document.querySelectorAll('.card-image-wrapper').forEach(wrapper => {
                wrapper.addEventListener('click', function() {
                    const img = this.querySelector('img');
                    const title = this.parentElement.querySelector('.card-title').textContent;
                    lightboxImg.src = img.src;
                    lightboxCaption.textContent = title;
                    lightboxOverlay.classList.add('active');
                });
            });

            lightboxClose.addEventListener('click', () => {
                lightboxOverlay.classList.remove('active');
            });

            lightboxOverlay.addEventListener('click', (e) => {
                if (e.target === lightboxOverlay) {
                    lightboxOverlay.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
