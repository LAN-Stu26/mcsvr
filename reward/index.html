<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伺服器投票 - Lazy Sheep Server</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <!-- 引入 Google Fonts 與 FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 引入共用導覽列樣式與加入頁面專用樣式 -->
    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="reward.css">
</head>
<body>

    <div class="container">

        <!-- 頁面頂部標題區 -->
        <header class="page-header">
            <h1 class="page-title"><i class="fa-solid fa-user-plus"></i> Server Reward</h1>
            <p class="page-subtitle">慶祝 | 補償 皆在這!</p>
        </header>

        <!-- 主要加入條款內容區塊 -->
        <main class="join-card">

            <!-- 白名單申請提示框 -->
            <!-- div class="whitelist-notice">
                <i class="fa-solid fa-circle-info"></i>
                <span>請瀏覽完整內容以保護您的權益 <br> 表單代碼: 00001 | 日期: 2026/07/29 - 8/1</span>
            </div -->

            <h2 class="terms-title"><i class="fa-solid fa-scroll"></i> 目前有的獎勵</h2>

            <!-- 條款清單 -->
            <ol class="terms-list">
                <li data-step="1">
                    2026/07/29 伺服器崩潰補償
                </li>
                <li data-step="2">
                    2026 8 月獎勵
                </li>
            </ol>

            <h2 class="terms-title"><i class="fa-solid fa-pen-to-square"></i> 領取表單</h2>

            <!-- 內嵌 Google 表單 -->
            <div class="form-wrapper">
                <iframe class="form-iframe" src="https://forms.gle/5U7yv7XfqY3C9Lo39" loading="lazy">載入中…</iframe>
            </div>

            <!-- 備用按鈕區 -->
            <div class="join-actions">
                <a href="https://forms.gle/5U7yv7XfqY3C9Lo39" target="_blank" rel="noopener noreferrer" class="mc-btn mc-btn-primary">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> 在新分頁開啟表單
                </a>
                <a href="/form/history" class="mc-btn">
                    <i class="fa-solid fa-book-bookmark"></i> 查看投票紀錄
                </a>
            </div>

        </main>

        <!-- 頁尾 -->
        <footer class="footer">
            <p>&copy; 2026 Lazy Sheep Minecraft Server. 本伺服器與 Mojang Studios / Microsoft 無關。</p>
        </footer>

    </div>

    <script src="/nav.js"></script>
</body>
</html>
