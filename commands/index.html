<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Sheep 伺服器 - 指令大全</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 引入共用導覽列樣式與頁面樣式 -->
    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="commands.css">
</head>
<body>
    <!-- 使用 script 標籤自動導入通用導覽列 -->
    <script src="/nav.js"></script>

    <div class="container">
        
        <!-- 頁面標頭 -->
        <header class="page-header">
            <h1 class="page-title">SERVER COMMANDS</h1>
            <p class="page-subtitle">伺服器常用指令與工具清單（點擊指令區塊可直接複製）</p>
        </header>

        <!-- 即時搜尋與快速過濾列 -->
        <div class="search-box">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="cmd-search" placeholder="輸入關鍵字搜尋指令... (例如: home, lock, 私訊, admin)" oninput="filterCommands()">
            </div>
            <div class="filter-tags">
                <button class="filter-btn active" onclick="filterCategory('all', this)">全部顯示</button>
                <button class="filter-btn" onclick="filterCategory('basic', this)">🏡 玩家實用</button>
                <button class="filter-btn" onclick="filterCategory('bolt', this)">🔐 防盜鎖定</button>
                <button class="filter-btn" onclick="filterCategory('lp', this)">👑 身份組與顏色</button>
                <button class="filter-btn" onclick="filterCategory('sys', this)">⚙️ 伺服器維護</button>
            </div>
        </div>

        <!-- 全域複製提示浮動視窗 -->
        <center>
            <div class="toast" id="cmd-toast">✔ 指令已成功複製到剪貼簿！</div>
        </center>

        <!-- 指令卡片動態渲染區域 -->
        <div class="commands-grid" id="commands-grid">
            <p style="color: #aaaaaa; text-align: center; grid-column: 1 / -1;">指令資料載入中...</p>
        </div>

        <!-- 查無資料提示 -->
        <div id="no-results" class="no-results-box" style="display: none;">
            <i class="fa-solid fa-ghost"></i> 找不到任何符合關鍵字的指令！
        </div>

        <!-- 頁尾 -->
        <footer class="footer">
            <p>&copy; 2026 Lazy Sheep Minecraft Server. 指令手冊系統持續更新中。</p>
        </footer>

    </div>

    <!-- JavaScript 動態載入 JSON 檔案與搜尋過濾 logic -->
    <script>
        let currentCategory = 'all';

        // 頁面載入後自動讀取同資料夾下的 cmd.json
        document.addEventListener('DOMContentLoaded', () => {
            fetch('cmd.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('無法讀取 cmd.json 檔案');
                    }
                    return response.json();
                })
                .then(data => {
                    renderCommands(data);
                })
                .catch(error => {
                    console.error('載入指令資料失敗:', error);
                    document.getElementById('commands-grid').innerHTML = '<p style="color:#ff5555; text-align:center; grid-column: 1 / -1;">⚠️ 指令資料讀取失敗，請確認同資料夾下是否存在 cmd.json。</p>';
                });
        });

        // HTML 轉義公用函式
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 動態產生指令卡片 DOM
        function renderCommands(categories) {
            const grid = document.getElementById('commands-grid');
            grid.innerHTML = '';

            categories.forEach(cat => {
                const card = document.createElement('section');
                card.className = 'cmd-card';
                card.setAttribute('data-category', cat.id);

                let cardHtml = `
                    <h2 class="card-title">${cat.title}</h2>
                    <p class="card-desc">${cat.desc}</p>
                    <div class="cmd-list">
                `;

                cat.commands.forEach(cmd => {
                    const adminClass = cmd.isAdmin ? ' admin-cmd' : '';
                    const displayCode = escapeHtml(cmd.code);

                    cardHtml += `
                        <div class="cmd-item${adminClass}" data-code="${escapeHtml(cmd.code)}">
                            <div class="cmd-badge ${cmd.badgeClass}">${cmd.badge}</div>
                            <div class="cmd-code">${displayCode}</div>
                            <div class="cmd-effect">${cmd.effect}</div>
                        </div>
                    `;
                });

                cardHtml += `</div>`;
                card.innerHTML = cardHtml;

                // 為每個指令區塊點擊事件綁定複製功能
                card.querySelectorAll('.cmd-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const codeToCopy = item.getAttribute('data-code');
                        copyCommand(codeToCopy);
                    });
                });

                grid.appendChild(card);
            });

            // 初始化時進行一次過濾確認
            filterCommands();
        }

        function copyCommand(cleanText) {
            navigator.clipboard.writeText(cleanText).then(() => {
                showToast();
            }).catch(err => {
                const tempInput = document.createElement('textarea');
                tempInput.value = cleanText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('cmd-toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        function filterCategory(cat, element) {
            currentCategory = cat;
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            }
            filterCommands();
        }

        function filterCommands() {
            const searchKeyword = document.getElementById('cmd-search').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.cmd-card');
            let totalVisibleItems = 0;

            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                const items = card.querySelectorAll('.cmd-item');
                let cardHasVisibleItem = false;

                if (currentCategory !== 'all' && cardCategory !== currentCategory) {
                    card.style.display = 'none';
                    return;
                }

                items.forEach(item => {
                    const cmdText = item.querySelector('.cmd-code').innerText.toLowerCase();
                    const effectText = item.querySelector('.cmd-effect').innerText.toLowerCase();
                    
                    if (cmdText.includes(searchKeyword) || effectText.includes(searchKeyword)) {
                        item.style.display = 'flex';
                        cardHasVisibleItem = true;
                        totalVisibleItems++;
                    } else {
                        item.style.display = 'none';
                    }
                });

                if (cardHasVisibleItem) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });

            const noResults = document.getElementById('no-results');
            if (totalVisibleItems === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        }
    </script>
</body>
</html>
