<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入伺服器條款與白名單申請 - Lazy Sheep Minecraft 伺服器</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <!-- 引入 Google Fonts 與 FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 引入共用導覽列樣式與加入頁面專用樣式 -->

    <!-- 阻擋瀏覽此頁面!!!!!!!!!!!!!!!!! -->
    <script>
        // 立即跳轉至目標網址
        window.location.href = "/503";
    </script>

    <link rel="stylesheet" href="/nav.css">
    <link rel="stylesheet" href="/footer.css">
    <link rel="stylesheet" href="join.css">
</head>
<body>

    <div class="container">

        <!-- 頁面頂部標題區 -->
        <header class="page-header">
            <h1 class="page-title"><i class="fa-solid fa-user-plus"></i> Join Server</h1>
            <p class="page-subtitle">歡迎加入 Lazy Sheep 伺服器！請在申請白名單前仔細閱讀以下條款。</p>
        </header>

        <!-- 主要加入條款內容區塊 -->
        <main class="join-card">

            <!-- 白名單申請提示框 -->
            <div class="whitelist-notice">
                <i class="fa-solid fa-circle-info"></i>
                <span>瀏覽條款即代表同意規則並已申請白名單。</span>
            </div>

            <h2 class="terms-title"><i class="fa-solid fa-scroll"></i> 伺服器重點條款</h2>

            <!-- 條款清單 -->
            <ol class="terms-list">
                <li data-step="1">
                    出生點的村莊禁止破壞，僅能使用伺服主介紹的公共設施。
                </li>
                <li data-step="2">
                    嚴禁偷竊或拆除他人私人物品。
                </li>
                <li data-step="3">
                    更多條款請看 <a href="/rules/" class="rules-link">/rules/</a>。
                </li>
            </ol>

            <h2 class="terms-title"><i class="fa-solid fa-pen-to-square"></i> 白名單申請表單</h2>

            <!-- 內嵌 Google 表單 -->
            <div class="form-wrapper">
                <iframe class="form-iframe" src="https://forms.gle/7ugsHdFabLoJWeLd8" loading="lazy">載入中…</iframe>
            </div>

            <!-- 備用按鈕區 -->
            <div class="join-actions">
                <a href="https://forms.gle/7ugsHdFabLoJWeLd8" target="_blank" rel="noopener noreferrer" class="mc-btn mc-btn-primary">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> 在新分頁開啟表單
                </a>
                <a href="/rules/" class="mc-btn">
                    <i class="fa-solid fa-book-bookmark"></i> 查看完整條款 (/rules/)
                </a>
            </div>

        </main>
    </div>

    <div id="footer-placeholder"></div>

    <script src="/nav.js"></script>
    <script src="/footer.js" defer></script>
</body>
</html>
